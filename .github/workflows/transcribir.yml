# Transcribe un audio con faster-whisper (tiempos por palabra) en una máquina de GitHub, no en el VPS de producción.
# Se dispara con un push que cambie transcribir/pedido.json (lo escribe transcribir-remoto.sh) o a mano.
# Entrada: transcribir/in/audio.* → salida: artifact "palabras" con palabras.json [[inicio, fin, palabra], ...].
name: transcribir
on:
  workflow_dispatch:
  push:
    paths: ['transcribir/pedido.json']

concurrency:
  group: transcribir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transcribir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: transcribir/requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r transcribir/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}
      - name: Transcribir
        run: python transcribir/transcribir.py transcribir/out
      - uses: actions/upload-artifact@v4
        with: { name: palabras, path: transcribir/out, retention-days: 3 }
